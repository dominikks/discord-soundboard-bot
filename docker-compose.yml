# Development Sandbox
services:
  db:
    image: postgres:latest@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD
    volumes:
      - ./.volumes/db/data:/var/lib/postgresql

  adminer:
    image: adminer:latest@sha256:400af848ac3f57938abde4867677df1b195674d232c8896a27d111d04b9c088c
    restart: on-failure
    ports:
      - "8080:8080"
